name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

# Monorepo: lockfile faqat root'da (npm workspaces). Har job root'dan `npm ci`
# qiladi — workspace ichida `npm install` lockfile'ni chetlab o'tib, CI'da
# prod image'dan boshqa versiyalar yechilishiga sabab bo'lardi (T5, iyul auditi).

jobs:
  secrets:
    # Sirlar (API kalit, parol, token) tarixga tushmasin — har PR va push'da
    # butun git tarixi skanerlanadi. Shaxsiy repo uchun litsenziya shart emas.
    name: Secrets — gitleaks skan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    # Prod bog'liqliklar: high/critical = qizil. Yopib bo'lmaydigan (major
    # upgrade talab qiladigan) advisory'lar audit-ci.jsonc allowlist'ida sabab
    # va muddat bilan turadi — ro'yxat bo'sh bo'lgani sari yaxshi.
    name: Dependencies — npm audit (audit-ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npx audit-ci@^7 --config audit-ci.jsonc

  backend:
    name: Backend — Lint / TypeCheck / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:cov

      - name: Prod env example ↔ PRODUCTION_REQUIRED_ENV (D1)
        working-directory: ${{ github.workspace }}
        run: node scripts/check-prod-env.mjs

  frontend:
    name: Frontend — Lint / TypeCheck / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    # Smoke E2E (Playwright): login → qidiruv → bron — HAQIQIY backend + seed
    # DB bilan (mock yo'q). Postgres/Redis — GitHub service konteynerlari;
    # Elasticsearch/Kafka/MinIO yo'q — backend ularsiz no-op rejimda ishlaydi
    # (ELASTICSEARCH_ENABLED=false, KAFKA_BROKERS/MINIO_ENDPOINT o'rnatilmagan).
    # Serverlarni Playwright webServer ko'taradi (apps/frontend/playwright.config.ts).
    name: E2E — Playwright smoke (login → qidiruv → bron)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sifat
          POSTGRES_USER: sifat
          POSTGRES_PASSWORD: sifat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sifat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sifat:sifat@localhost:5432/sifat
      DIRECT_DATABASE_URL: postgresql://sifat:sifat@localhost:5432/sifat
      REDIS_URL: redis://localhost:6379
      ELASTICSEARCH_ENABLED: "false"
      # Faqat CI uchun qiymatlar — production sirlari emas.
      JWT_SECRET: e2e-only-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: e2e-only-jwt-refresh-secret-not-for-production
      QR_HMAC_SECRET: e2e-only-qr-hmac-secret-not-for-production
      PORT: "4000"
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Prisma generate + migrate deploy + seed (demo akkauntlar)
        working-directory: apps/backend
        env:
          NODE_ENV: development
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Build frontend (API — /api proxy orqali, OTP bypass o'chiq)
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: ""
          BACKEND_PROXY_TARGET: http://localhost:4000
          NEXT_PUBLIC_DISABLE_OTP: "false"
        run: npm run build

      - name: Install Playwright browser (chromium)
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E
        working-directory: apps/frontend
        env:
          BACKEND_PROXY_TARGET: http://localhost:4000
        run: npm run e2e

      - name: Upload Playwright report (xato bo'lsa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

  docker-build:
    name: Docker — Build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          # D6: monorepo — kontekst root, lockfile shu yerda (npm ci --workspace)
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: sifat-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          tags: sifat-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
