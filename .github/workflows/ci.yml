name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

# Monorepo: lockfile faqat root'da (npm workspaces). Har job root'dan `npm ci`
# qiladi — workspace ichida `npm install` lockfile'ni chetlab o'tib, CI'da
# prod image'dan boshqa versiyalar yechilishiga sabab bo'lardi (T5, iyul auditi).

jobs:
  secrets:
    # Sirlar (API kalit, parol, token) tarixga tushmasin — har PR va push'da
    # butun git tarixi skanerlanadi. Shaxsiy repo uchun litsenziya shart emas.
    name: Secrets — gitleaks skan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    # Prod bog'liqliklar: high/critical = qizil. Yopib bo'lmaydigan (major
    # upgrade talab qiladigan) advisory'lar audit-ci.jsonc allowlist'ida sabab
    # va muddat bilan turadi — ro'yxat bo'sh bo'lgani sari yaxshi.
    name: Dependencies — npm audit (audit-ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npx audit-ci@^7 --config audit-ci.jsonc

  backend:
    name: Backend — Lint / TypeCheck / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:cov

      - name: Prod env example ↔ PRODUCTION_REQUIRED_ENV (D1)
        working-directory: ${{ github.workspace }}
        run: node scripts/check-prod-env.mjs

  frontend:
    name: Frontend — Lint / TypeCheck / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker-build:
    name: Docker — Build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          # D6: monorepo — kontekst root, lockfile shu yerda (npm ci --workspace)
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: sifat-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          tags: sifat-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
