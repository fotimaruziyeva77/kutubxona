name: Deploy → dev.sifat.uz

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Build & Deploy to dev.sifat.uz
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Backend build ──────────────────────────────────────────
      - name: Install backend deps
        working-directory: apps/backend
        run: npm install

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      # ── Frontend build ─────────────────────────────────────────
      - name: Install frontend deps
        working-directory: apps/frontend
        run: npm install

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://dev.sifat.uz/api

      # ── SSH Deploy ─────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H dev.sifat.uz >> ~/.ssh/known_hosts

      - name: Deploy to dev server
        run: bash infra/scripts/deploy.sh dev ${{ github.sha }}
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}

      # ── Smoke test ─────────────────────────────────────────────
      - name: Smoke test
        run: |
          sleep 5
          curl -sf https://dev.sifat.uz/api/docs > /dev/null
          echo "✅ dev.sifat.uz ishlamoqda"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ dev.sifat.uz deploy muvaffaqiyatsiz! SHA: ${{ github.sha }}'
            })
