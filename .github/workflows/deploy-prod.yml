name: Deploy — Production (sifat.uz)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release versiyasi (misol: 1.0.1)"
        required: false

# Bir vaqtda faqat 1 production deploy ishlaydi
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ── 1. CI tekshiruvlari o'tishi shart ─────────────────────────────────────
  pre-deploy-checks:
    name: Pre-deploy tekshiruvlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Backend — install + typecheck
        working-directory: apps/backend
        run: |
          npm install
          npx prisma generate
          npm run typecheck

      - name: Frontend — install + build
        working-directory: apps/frontend
        run: |
          npm install
          npm run build

  # ── 2. Docker image larni build qilib registry ga push ──────────────────
  build-and-push:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: GitHub Container Registry ga login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Version aniqlash
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.sha }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Backend image build & push
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Frontend image build & push
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ── 3. Production serverga deploy ─────────────────────────────────────────
  deploy:
    name: Production deploy (sifat.uz)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://sifat.uz

    steps:
      - uses: actions/checkout@v4

      - name: Version aniqlash
        id: version
        run: echo "version=${{ github.event.inputs.version || github.sha }}" >> $GITHUB_OUTPUT

      - name: DB migration + rolling deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            set -e
            cd /srv/sifat
            export VERSION=${{ steps.version.outputs.version }}
            export REGISTRY=ghcr.io/${{ github.repository }}

            # 1) Yangi image'larni pull qilish
            docker compose -f docker-compose.prod.yml pull backend frontend

            # 2) Migratsiya — YANGI image ichidan, servislar yangilanishidan OLDIN.
            #    Eski `exec -T backend npx prisma migrate deploy` ESKI container
            #    ichida ishlar edi: prisma CLI yo'q (devDependency, --omit=dev) va
            #    migrations/ katalogi image'ga ko'chirilmagani uchun 0 ta migratsiya
            #    topar edi. `compose run` depends_on'dagi postgres/pgbouncer
            #    healthy bo'lishini kutadi. Migration backward-compatible bo'lishi
            #    shart (CI da tekshirilgan). `set -e` tufayli migratsiya yiqilsa
            #    deploy shu yerda to'xtaydi — eski containerlar ishlashda davom etadi.
            docker compose -f docker-compose.prod.yml run --rm backend \
              prisma migrate deploy
            echo "✅ Migration bajarildi"

            # 3) Servislarni ko'tarish. container_name olib tashlangani uchun
            #    `up -d` deploy.replicas (backend=3, frontend=2) ni o'zi qo'llaydi —
            #    qo'shimcha --scale kerak EMAS (Compose v2 nomlangan containerni
            #    scale qila olmasdi).
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 4) Nginx upstream'dagi `backend` nomini startupda resolve qilgan —
            #    yangi container IP'lari uchun reload (config xato bo'lsa reload
            #    rad etiladi, eski worker'lar ishlayveradi).
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true

            echo "✅ Deploy bajarildi: $VERSION"

      - name: Smoke test
        run: |
          sleep 30  # Container ko'tarilishini kutish
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sifat.uz/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke test muvaffaqiyatsiz: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Smoke test o'tdi: HTTP $STATUS"

      - name: Telegram bildirishnoma
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} Production deploy: ${{ job.status }}
            📦 Version: ${{ steps.version.outputs.version }}
            🔗 https://sifat.uz
            👤 ${{ github.actor }}
