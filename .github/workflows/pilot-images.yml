# Pilot server (sifatlibrary.uz) uchun Docker image'lar — GitHub'da yig'iladi,
# server faqat `docker compose pull` qiladi (server RAM'i build uchun tanqis).
#   ghcr.io/<owner>/kutubxona-backend:pilot
#   ghcr.io/<owner>/kutubxona-frontend:pilot   (NEXT_PUBLIC_* = PILOT_URL)
#   ghcr.io/<owner>/kutubxona-tools:pilot      (migratsiya/seed/admin)
name: pilot-images

on:
  push:
    branches: [feature/frontend-fixes]
    paths: ["apps/**", "package.json", "package-lock.json", ".dockerignore", ".github/workflows/pilot-images.yml"]
  workflow_dispatch:

concurrency:
  group: pilot-images
  cancel-in-progress: true

env:
  PILOT_URL: https://sifatlibrary.uz

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            file: apps/backend/Dockerfile
            target: runner
          - name: tools
            file: apps/backend/Dockerfile
            target: builder
          - name: frontend
            file: apps/frontend/Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@v4

      - name: Image nomi (kichik harf)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kutubxona-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          # NEXT_PUBLIC_API_URL bo'sh — brauzer o'z domenidagi /api ga so'raydi
          # (image bir nechta domenda ishlaydi; nginx /api ni backendga uzatadi).
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_SITE_URL=${{ env.PILOT_URL }}
            BACKEND_PROXY_TARGET=http://backend:4000
          tags: |
            ${{ steps.img.outputs.name }}:pilot
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=pilot-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=pilot-${{ matrix.name }}
