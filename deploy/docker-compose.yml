# ─────────────────────────────────────────────────────────────────────────────
# SIFAT LIBRARY — PILOT o'rnatish (bitta server, ~4 GB RAM)
#
#   cd /srv/sifat/deploy
#   docker compose up -d --build
#
# Barcha sozlamalar shu papkadagi .env faylida (install.sh yaratadi).
# docker-compose.prod.yml (14 servis, 3 replika) — katta production uchun;
# pilotga bu yengil variant: 1 backend, 1 frontend, replikasiz baza.
# Tashqariga faqat Caddy (80/443) ochiq; qolgan hamma servis ichki tarmoqda.
# ─────────────────────────────────────────────────────────────────────────────
name: sifat

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── Tashqi kirish: HTTPS (Let's Encrypt sertifikatni Caddy o'zi oladi) ─────
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS kerak}
      WWW_ADDRESS: ${WWW_ADDRESS:?WWW_ADDRESS kerak}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL kerak}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    mem_limit: 128m
    logging: *logging

  # ── Ilova ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    image: sifat-backend:local
    restart: unless-stopped
    env_file: .env
    environment: &backend_env
      NODE_ENV: production
      PORT: "4000"
      TZ: Asia/Tashkent
      DATABASE_URL: postgresql://sifat:${POSTGRES_PASSWORD}@postgres:5432/sifat?schema=public
      DIRECT_DATABASE_URL: postgresql://sifat:${POSTGRES_PASSWORD}@postgres:5432/sifat?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      VAULT_ADDR: http://vault:8200
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: sifat
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ELASTICSEARCH_ENABLED: "false"
      FRONTEND_URL: ${PUBLIC_URL}
      PUBLIC_BASE_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${PUBLIC_URL}
      TRUSTED_PROXY: "1"
    volumes:
      # Kalit fayllar (masalan Firebase fcm.json) — gitga kirmaydi.
      - ./secrets:/app/apps/backend/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      vault: { condition: service_healthy }
      minio: { condition: service_started }
      kafka: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    logging: *logging

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        # Brauzer API'ni shu manzilga yuboradi (Caddy /api ni backendga uzatadi).
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
        BACKEND_PROXY_TARGET: http://backend:4000
    image: sifat-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_PROXY_TARGET: http://backend:4000
    depends_on:
      - backend
    mem_limit: 512m
    logging: *logging

  # ── Ma'lumotlar ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sifat
      POSTGRES_DB: sifat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      TZ: Asia/Tashkent
    command: >
      postgres -c shared_buffers=256MB -c effective_cache_size=768MB
               -c max_connections=100 -c work_mem=8MB
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifat -d sifat"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ navbatlari va OTP kalitlari o'chib ketmasin.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD kerak}
                   --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 256m
    logging: *logging

  minio:
    # minio/minio Docker Hub'dan olib tashlangan (2025) — Pigsty jamoa fork'i.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: sifat
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD kerak}
    volumes:
      - minio_data:/data
    mem_limit: 384m
    logging: *logging

  # Vault — backend production'da Vault'ga ulanishni talab qiladi. Pilotda
  # sirlar .env'da turadi; bu yerda Vault faqat "dev" rejimida (xotirada,
  # tashqariga ochiq emas). Haqiqiy Vault keyingi bosqichda.
  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?VAULT_TOKEN kerak}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      SKIP_SETCAP: "true"
    command: server -dev
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    logging: *logging

  # Kafka — bitta tugunli KRaft (Zookeeper'siz), kichik xotira.
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    # Hodisalar vaqtinchalik (AI audit oqimi) — disk tomi kerak emas.
    mem_limit: 512m
    logging: *logging

  # ── Xizmat buyruqlari (migratsiya, seed, admin) — doim ishlamaydi ──────────
  #   docker compose run --rm tools npx prisma migrate deploy
  tools:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: builder
    image: sifat-tools:local
    profiles: ["tools"]
    env_file: .env
    environment: *backend_env
    depends_on:
      postgres: { condition: service_healthy }
    working_dir: /app/apps/backend
    entrypoint: []
    command: ["echo", "tools: buyruq bering"]

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
