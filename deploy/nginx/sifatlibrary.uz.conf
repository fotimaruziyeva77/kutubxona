# SIFAT LIBRARY — serverdagi mavjud nginx uchun sayt bloki.
# install.sh buni /etc/nginx/sites-available/sifatlibrary.uz ga ko'chiradi;
# HTTPS (443) va HTTP→HTTPS yo'naltirishni keyin `certbot --nginx` qo'shadi.
# Portlar deploy/.env dagi FRONTEND_PORT / BACKEND_PORT bilan bir xil.
#
# Eslatma: `map $http_upgrade ...` ishlatilmagan — boshqa saytlar konfigida
# shu nomli map bo'lsa, nginx -t takroriy e'lon xatosini beradi.

server {
    listen 80;
    listen [::]:80;
    server_name www.sifatlibrary.uz;
    return 301 https://sifatlibrary.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sifatlibrary.uz;

    client_max_body_size 25m;

    # next.config: images.unoptimized — rasm optimizatori ishlatilmaydi.
    location ^~ /_next/image {
        return 404;
    }

    # WebSocket (statistika jonli yangilanishi)
    location ~ ^/(socket\.io|ws)(/|$) {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # API va health — backend
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Qolgan hammasi — Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
