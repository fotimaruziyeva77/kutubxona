global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: sifat-library
    env: dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "sifat-backend"
    static_configs:
      - targets: ["host.docker.internal:4000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "sifat-frontend"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: "/_next/static/chunks/pages/_app.js"
    scrape_interval: 30s

  - job_name: "postgres"
    static_configs:
      - targets: ["sifat-postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["sifat-redis:6379"]

  - job_name: "kafka"
    static_configs:
      - targets: ["sifat-kafka:9092"]
