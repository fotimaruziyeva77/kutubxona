##############################################################################
# SIFAT LIBRARY — Nginx Production Config
# - HTTP → HTTPS redirect
# - TLS 1.3
# - Gzip kompressiya
# - Security headers (OWASP)
# - Rate limiting
# - Proxy to backend + frontend
##############################################################################

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    # E'TIBOR: nginx faqat r/s va r/m birliklarini qabul qiladi — `10r/h`
    # nginx -t da [emerg] "invalid rate" bilan yiqilar edi (boot-blocker).
    # OTP uchun qat'iy 5 urinish/soat limiti backend (throttler) da amalga
    # oshirilgan; nginx tashqi qatlam sifatida 1r/m (+ location'dagi burst).
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/m;
    limit_req_status 429;

    # ── Proxy cache ───────────────────────────────────────────────────────────
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=sifat_cache:10m max_size=1g inactive=60m;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream backend {
        # ip_hash (sticky session) — stats.gateway.ts deploy talabi:
        # Socket.IO handshake'ning HTTP long-polling fallback'i bitta klientning
        # barcha so'rovlari AYNI bitta backend replicaga tushishini talab qiladi,
        # aks holda "Session ID unknown" 400 xatolari chiqadi. Redis adapter
        # faqat broadcast fan-out'ni hal qiladi, stickiness'ni emas.
        # (Shu sababli least_conn dan ataylab voz kechilgan.)
        # Eslatma: nginx `backend` nomini startupda resolve qiladi — deploy
        # skripti containerlarni yangilagach `nginx -s reload` bajaradi.
        ip_hash;
        server backend:4000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name sifat.uz www.sifat.uz api.sifat.uz;
        return 301 https://$host$request_uri;
    }

    # ── Main frontend (sifat.uz) ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name sifat.uz www.sifat.uz;

        # SSL
        ssl_certificate     /etc/nginx/ssl/sifat.uz.crt;
        ssl_certificate_key /etc/nginx/ssl/sifat.uz.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security headers (OWASP)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.sifat.uz wss://api.sifat.uz; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

        # Statik fayllar — uzun cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://frontend;
            proxy_cache sifat_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_503;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Service Worker — no cache
        location = /sw.js {
            proxy_pass http://frontend;
            add_header Cache-Control "no-store, no-cache";
        }

        # Manifest, robots, sitemap
        location ~* \.(json|xml|txt)$ {
            proxy_pass http://frontend;
            add_header Cache-Control "public, max-age=86400";
        }

        # Next.js pages
        # Next 14.2 Image Optimization API — unauthenticated RCE/DoS advisory'lari
        # (audit-ci.jsonc allowlist). next/image ishlatilmaydi, images.unoptimized=true;
        # endpoint umuman ochilmasin. Next 15.5.28+/16 ga o'tilgach olib tashlanadi.
        location ^~ /_next/image {
            return 404;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }

    # ── API (api.sifat.uz) ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.sifat.uz;

        ssl_certificate     /etc/nginx/ssl/api.sifat.uz.crt;
        ssl_certificate_key /etc/nginx/ssl/api.sifat.uz.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:APISSL:5m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;

        # CORS preflight
        add_header Access-Control-Allow-Origin "https://sifat.uz" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Auth endpointlar — qat'iy rate limit
        location ~ ^/api/v1/auth/(send-otp|verify-otp) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }

        # Webhook endpointlar
        location ~ ^/api/v1/(store/purchases|reading/webhook|payment/(payme|click)) {
            limit_req zone=webhook burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # Umumiy API
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;

            # Ochiq statistika endpointlar keshlanadi
            location ~* ^/api/v1/(stats/public|geo|top/) {
                proxy_cache sifat_cache;
                proxy_cache_valid 200 5m;
                proxy_cache_use_stale error timeout;
                add_header X-Cache-Status $upstream_cache_status;
                proxy_pass http://backend;
            }
        }

        # WebSocket (real vaqt dashboard) — gateway path: "/ws" (stats.gateway.ts).
        # Socket.IO server default /socket.io/ emas, /ws da xizmat qiladi —
        # shu ikki block bo'lmasa barcha realtime so'rovlar 404 qaytaradi.
        location = /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # Eski /socket.io/ yo'li xavfsizlik uchun saqlab qolindi
        # (default-path klientlar yoki kelajakdagi gatewaylar uchun).
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Swagger docs (faqat staging da ochiq)
        location /api/docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Health check (monitoring uchun)
        location /health {
            proxy_pass http://backend;
            access_log off;
        }
    }
}
